name: SSCC Junnar ERP CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sscc_user
          POSTGRES_PASSWORD: sscc_password
          POSTGRES_DB: sscc_junnar
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: |
          cd server
          npm ci

      - name: Validate JS syntax across all server files
        run: |
          cd server
          node --check src/index.js
          node --check src/routes/auth.js
          node --check src/routes/admin.js
          node --check src/routes/teacher.js
          node --check src/routes/student.js
          node --check src/routes/notifications.js
          node --check src/routes/payments.js

      - name: Run Prisma Generate & Validate
        run: |
          cd server
          npx prisma validate
          npx prisma generate

      - name: Run Unit Tests
        run: |
          cd server
          npm test -- --run
        env:
          DATABASE_URL: "postgresql://sscc_user:sscc_password@localhost:5432/sscc_junnar?schema=public"
          REDIS_URL: "redis://localhost:6379"
          JWT_SECRET: "test-jwt-secret-min-64-chars-long-for-github-actions-ci-pipeline-key"
          ADMIN_ACCESS_KEY: "test-admin-access-key-2026"
