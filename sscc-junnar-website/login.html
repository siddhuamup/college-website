<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Portal login — SSC College, Junnar</title>
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div id="site-header"></div>

<main id="main-content">
  <section class="container mt-4" style="max-width:480px">
    <div class="card" style="box-shadow: 0 10px 30px rgba(0,0,0,0.25); border-radius: 16px; padding: 2rem;">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <h2 style="font-size: 1.75rem; font-weight: 800; margin-bottom: 0.25rem;">Portal Login</h2>
        <p class="small" style="color: var(--text-secondary);">Access your academic dashboard and portal</p>
      </div>

      <!-- Role Tabs with SVG Icons -->
      <div class="steps mt-3" aria-label="Portal roles" style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;">
        <button type="button" class="step-pill active" data-role="teacher" style="display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; font-weight: 600;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
          </svg>
          Teacher
        </button>
        <button type="button" class="step-pill" data-role="student" style="display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; font-weight: 600;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
            <path d="M6 12v5c3 3 9 3 12 0v-5"/>
          </svg>
          Student
        </button>
        <button type="button" class="step-pill" data-role="admin" style="display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; font-weight: 600;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          Admin
        </button>
      </div>

      <p id="role-msg" class="small mt-3" style="text-align: center; color: var(--text-secondary);">Use credentials provided by the college.</p>

      <form id="login-form" class="mt-3 form-grid" style="display: flex; flex-direction: column; gap: 16px;">
        <div>
          <label class="field-label" for="email" id="email-label" style="font-weight: 600; font-size: 0.85rem; margin-bottom: 6px; display: block;">Email Address or ERP ID</label>
          <div style="position: relative;">
            <span style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); display: flex; align-items: center;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </span>
            <input class="input" id="email" name="email" type="text" autocomplete="username" placeholder="e.g. 2023CS001 or rahul.sharma@ssccjunnar.edu" required style="padding-left: 40px; width: 100%; border-radius: 10px; height: 44px;"/>
          </div>
        </div>

        <div>
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <label class="field-label" for="password" style="font-weight: 600; font-size: 0.85rem; margin: 0;">Password</label>
            <a href="#" id="forgot-password-link" class="small" style="color: var(--primary); text-decoration: none; font-weight: 500;">Forgot password?</a>
          </div>
          <div style="position: relative;">
            <span style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); display: flex; align-items: center;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input class="input" id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required style="padding-left: 40px; padding-right: 40px; width: 100%; border-radius: 10px; height: 44px;"/>
            <button type="button" id="toggle-password-btn" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: transparent; border: none; color: var(--muted); cursor: pointer; display: flex; align-items: center; padding: 4px;" aria-label="Toggle password visibility">
              <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg id="eye-off-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </div>

        <button class="btn mt-2" type="submit" style="width: 100%; height: 44px; border-radius: 10px; font-weight: 700; font-size: 1rem; display: inline-flex; align-items: center; justify-content: center; gap: 8px;">
          <span>Sign In to Portal</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
            <polyline points="10 17 15 12 10 7"/>
            <line x1="15" y1="12" x2="3" y2="12"/>
          </svg>
        </button>
      </form>
      <p id="login-msg" class="small mt-3" role="status"></p>
    </div>
  </section>

  <!-- Forgot Password Modal -->
  <div class="modal-overlay" id="forgot-modal" style="display:none; z-index: 9999;">
    <div class="modal-container" style="max-width: 400px;">
      <div class="modal-header">
        <h3 class="modal-title">Reset Password</h3>
        <button type="button" class="btn-close" id="close-forgot" style="background:transparent; border:none; color:var(--text-secondary); font-size:1.5rem; cursor:pointer;">&times;</button>
      </div>
      <form id="forgot-form" style="padding: 1rem 0 0 0;" class="form-grid">
        <p class="small" style="color: var(--text-secondary); margin-bottom: 1rem;">
          Enter your registered email address below. If the email exists in our records, a secure password reset link will be sent to you.
        </p>
        <div>
          <label class="field-label" for="forgot-email">Email Address</label>
          <input class="input" id="forgot-email" type="email" required style="width:100%;"/>
        </div>
        <button class="btn mt-3" type="submit" style="width:100%;">Send Reset Link</button>
        <p id="forgot-msg" class="small mt-2" role="status"></p>
      </form>
    </div>
  </div>
</main>


  <div id="site-footer"></div>
  <script src="js/layout.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    let selectedRole = 'teacher';
    const roleMsg = document.getElementById('role-msg');
    const loginMsg = document.getElementById('login-msg');

    function roleHint(role) {
      if (role === 'student') return 'Enter your Student ID, College Email, or Personal Email to continue.';
      if (role === 'admin') return 'Use Principal/Admin email & password, or enter Server Access Key at the Admin Portal.';
      return 'Use teacher credentials provided by the college.';
    }

    document.querySelectorAll('.step-pill').forEach((btn) => {
      btn.addEventListener('click', () => {
        selectedRole = btn.getAttribute('data-role') || 'teacher';
        document.querySelectorAll('.step-pill').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        roleMsg.textContent = roleHint(selectedRole);
        
        const label = document.getElementById('email-label');
        if (label) {
          label.textContent = selectedRole === 'student' ? 'Student ID, College Email, or Personal Email' : (selectedRole === 'admin' ? 'Admin Email Address' : 'Email Address');
        }
        
        loginMsg.textContent = '';
        loginMsg.className = 'small mt-3';
      });
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      loginMsg.textContent = '';
      loginMsg.className = 'small mt-3';
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        loginMsg.textContent = 'Please enter both email/ID and password.';
        loginMsg.className = 'small mt-3 alert error';
        return;
      }

      // Try general auth login endpoint first, fallback to role-specific endpoint
      try {
        let data;
        try {
          data = await SSC_API.post('/auth/login', { email, password });
        } catch (err) {
          if (selectedRole === 'student') {
            data = await SSC_API.post('/student/login', { email, password });
          } else if (selectedRole === 'teacher') {
            data = await SSC_API.post('/teacher/login', { email, password });
          } else {
            throw err;
          }
        }

        SSC_API.setToken(data.token);
        const role = String(data.user && data.user.role != null ? data.user.role : '').toLowerCase();
        if (role === 'teacher') location.href = 'teacher/index.html';
        else if (role === 'student') location.href = 'student/index.html';
        else if (role === 'admin') location.href = 'admin/index.html';
        else {
          SSC_API.setToken(null);
          loginMsg.textContent = 'Unrecognised role on this account. Contact administrator.';
          loginMsg.className = 'small mt-3 alert error';
        }
      } catch (err) {
        const detail = err.data && err.data.error ? err.data.error : err.message;
        loginMsg.textContent = detail || 'Sign in failed. Check your credentials.';
        loginMsg.className = 'small mt-3 alert error';
      }
    });

    // Forgot Password Logic
    const forgotLink = document.getElementById('forgot-password-link');
    const forgotModal = document.getElementById('forgot-modal');
    const closeForgot = document.getElementById('close-forgot');
    const forgotForm = document.getElementById('forgot-form');
    const forgotMsg = document.getElementById('forgot-msg');

    forgotLink.addEventListener('click', (e) => {
      e.preventDefault();
      forgotModal.style.display = 'flex';
      document.getElementById('forgot-email').focus();
      forgotMsg.textContent = '';
      forgotMsg.className = 'small mt-2';
    });

    closeForgot.addEventListener('click', () => {
      forgotModal.style.display = 'none';
    });

    // Close modal on escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && forgotModal.style.display === 'flex') {
        forgotModal.style.display = 'none';
      }
    });

    forgotForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      forgotMsg.textContent = 'Sending reset link...';
      forgotMsg.className = 'small mt-2 text-muted';
      
      const email = document.getElementById('forgot-email').value.trim();
      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to send reset link');
        
        forgotMsg.textContent = data.message || 'If the email exists, a reset link has been sent.';
        forgotMsg.className = 'small mt-2 alert success';
        
        setTimeout(() => {
          forgotModal.style.display = 'none';
          forgotForm.reset();
        }, 3000);
      } catch (err) {
        forgotMsg.textContent = err.message || 'Could not send reset link. Please try again.';
        forgotMsg.className = 'small mt-2 alert error';
      }
    });

    // Toggle Password Visibility
    const togglePassBtn = document.getElementById('toggle-password-btn');
    const passInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eye-icon');
    const eyeOffIcon = document.getElementById('eye-off-icon');

    if (togglePassBtn && passInput) {
      togglePassBtn.addEventListener('click', () => {
        const isPass = passInput.type === 'password';
        passInput.type = isPass ? 'text' : 'password';
        eyeIcon.style.display = isPass ? 'none' : 'block';
        eyeOffIcon.style.display = isPass ? 'block' : 'none';
      });
    }
  </script>
</body>
</html>
